# Context -> CVSS v3.1 Security Requirements (owner: Asim).
# Format: docs/cvss-mapping-contract.md   Validate with: make validate-config
#
# Values: L (Low), M (Medium), H (High), X (Not Defined = no change).
# TEMPLATE: every row is X, so environmental scores equal base scores until
# Asim fills in the real requirements.
mapping_version: 1

sensitivity_classes:
  CRITICAL: {CR: X, IR: X, AR: X}
  HIGH:     {CR: X, IR: X, AR: X}
  MEDIUM:   {CR: X, IR: X, AR: X}
  LOW:      {CR: X, IR: X, AR: X}

body_signals:
  CREDENTIALS: {CR: X, IR: X, AR: X}
  PII:         {CR: X, IR: X, AR: X}
  FINANCIAL:   {CR: X, IR: X, AR: X}
  INTERNAL_IP: {CR: X, IR: X, AR: X}

# Per requirement, the highest of the endpoint's class and any detected signals wins.
combine: max
