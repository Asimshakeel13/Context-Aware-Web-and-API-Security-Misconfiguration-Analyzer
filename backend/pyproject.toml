[project]
name = "cawasma-backend"
version = "1.0.0"
description = "CAWASMA — context-aware web & API security misconfiguration analyzer (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web stack
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "starlette==0.41.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    # Database
    "SQLAlchemy==2.0.36",
    "asyncpg==0.30.0",
    "greenlet==3.1.1",          # required by SQLAlchemy async
    "alembic==1.14.0",          # runs on asyncpg too (migrations/env.py)
    # Async tasks + pub/sub
    "celery==5.4.0",
    "redis==5.2.1",
    # HTTP engine + parsing
    "httpx==0.28.1",
    "beautifulsoup4==4.12.3",
    "cryptography==44.0.0",     # TLS certificate parsing
    # Reporting
    "weasyprint==63.1",
    "jinja2==3.1.4",
]
# The NLP stack (torch CPU, sentence-transformers, spaCy) is in
# requirements-ml.txt because torch must come from PyTorch's CPU index.

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "aiosqlite==0.22.1",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "BLE"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "S110",  # best-effort cleanup (close/unsubscribe) in finally blocks is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S311"]
# Rule catalog and the HTML report template are data; long lines read better.
"app/core/checks/catalog.py" = ["E501"]
"app/core/reports.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = ["app", "scripts"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*", "weasyprint.*", "sentence_transformers.*", "spacy.*", "bs4.*", "numpy.*"]
ignore_missing_imports = true
