chains_version: 1

chains:
  - chain_id: C005
    name: .env Exposure -> Version Leak -> Full Compromise
    description: >-
      An exposed .env file combined with server version disclosure can lead to
      full compromise.
    requires: [INF-003, HDR-007, INF-004]   # check_ids that can contribute
    mandatory: [INF-003]                    # must all be present
    min_matches: 2                          # of `requires`, including mandatory
    composite_score: 9.8                    # documented template score, not computed CVSS
    severity: CRITICAL                      # must match the score's bucket
