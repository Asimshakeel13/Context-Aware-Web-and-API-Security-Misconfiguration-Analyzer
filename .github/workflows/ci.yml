name: CI

# Jobs are independent so each owner can add or change theirs without touching
# the others: branch-name (repo rule), backend-* (Atta), frontend (Neelam).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name (<name>/pNN-topic)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(atta|neelam|asim)/p[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch '$BRANCH' must match <name>/pNN-topic, e.g. atta/p01-repo-setup (name: atta|neelam|asim)"
            exit 1
          fi

  backend-lint:
    name: Backend lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . --output-format=github
      - name: mypy
        run: mypy
      - name: Spec files (config/*.yaml)
        run: python scripts/validate_specs.py all
      - name: docs/openapi.json is current
        run: python scripts/export_openapi.py --check

  backend-test:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cawasma
          POSTGRES_PASSWORD: cawasma
          POSTGRES_DB: cawasma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cawasma -d cawasma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
      DATABASE_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
      ALEMBIC_SQLALCHEMY_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # WeasyPrint native libs, so the PDF report path is exercised too.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Models and migrations are in sync
        run: alembic check
      - name: Migrations roll back cleanly
        run: alembic downgrade base
      - name: pytest
        run: pytest -q

  # ------------------------------------------------------------- frontend
  # Neelam. Node 22: shadcn's `cn` package requires it.
  frontend:
    name: Frontend lint, type-check, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
