name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . --output-format=github
      - name: mypy
        run: mypy

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cawasma
          POSTGRES_PASSWORD: cawasma
          POSTGRES_DB: cawasma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cawasma -d cawasma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
      DATABASE_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # WeasyPrint native libs, so the PDF report path is exercised too.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          ALEMBIC_SQLALCHEMY_URL: postgresql+psycopg2://cawasma:cawasma@localhost:5432/cawasma_test
      - name: Migrations roll back cleanly
        run: alembic downgrade base
        env:
          ALEMBIC_SQLALCHEMY_URL: postgresql+psycopg2://cawasma:cawasma@localhost:5432/cawasma_test
      - name: pytest
        run: pytest -q
