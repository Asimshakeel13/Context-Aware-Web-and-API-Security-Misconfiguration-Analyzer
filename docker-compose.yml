# CAWASMA development stack: api (FastAPI) + worker (Celery) + postgres + redis.
#
#   make up                 # or: docker compose up -d --build
#   curl localhost:8000/health
#
# The api container runs `alembic upgrade head` before serving. Configuration
# comes from .env (optional; copy .env.example). Container-to-container URLs
# are set below so .env can keep host-side values for local tooling.
#
# Evaluation targets (Asim) live in docker-compose.eval.yml on their own network.

name: cawasma

x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_ML: ${INSTALL_ML:-true}
  image: cawasma-backend:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cawasma}:${POSTGRES_PASSWORD:-cawasma}@postgres:5432/${POSTGRES_DB:-cawasma}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  volumes:
    # Spec files (checks, CVSS mapping, chains); settings.CONFIG_DIR = /config.
    - ./config:/config:ro
  networks: [backend]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cawasma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cawasma}
      POSTGRES_DB: ${POSTGRES_DB:-cawasma}
    ports:
      - "${POSTGRES_HOST_PORT:-5446}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      # Wait for the api so migrations have been applied.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------- frontend
  # Slot for Neelam's Next.js app. Opt-in so the backend starts on its own:
  #   docker compose --profile frontend up -d --build
  # Currently builds the existing Vite SPA in ./frontend; when the Next.js app
  # lands, point `context` at it, switch the build arg to NEXT_PUBLIC_API_BASE
  # and change the port mapping to 3000. Keep FRONTEND_ORIGIN (CORS) in .env in
  # sync with the published URL.
  frontend:
    profiles: [frontend]
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:${API_HOST_PORT:-8000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    name: cawasma-backend

volumes:
  pgdata:
